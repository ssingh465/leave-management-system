# =============================================================================
# Logstash pipeline for ELMS
# -----------------------------------------------------------------------------
# Filebeat ships Docker container logs to this pipeline. Each event has a
# top-level `message` field that contains the raw line emitted by the
# container's stdout. Our Python services emit one JSON object per line via
# `shared.logging_config.configure_logging`, so we json-decode `message` into
# structured fields and drop the raw string.
# =============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # The container's stdout line lives in `message`. If the application logged
  # JSON, hoist its fields to the top level of the event.
  if [message] =~ "^\s*\{" {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }

    if [app] {
      # Promote the parsed fields to the top level so they're easy to query in
      # Kibana (e.g. `service`, `level`, `logger`, `message`).
      mutate {
        rename => {
          "[app][timestamp]"      => "app_timestamp"
          "[app][level]"          => "level"
          "[app][logger]"         => "logger"
          "[app][message]"        => "message"
          "[app][service]"        => "service"
          "[app][exception_type]" => "exception_type"
        }
      }

      # Anything else inside `app` (extras, exc_info, etc.) stays nested under
      # `app.*` for future use.
      if [app_timestamp] {
        date {
          match => [ "app_timestamp", "ISO8601" ]
          target => "@timestamp"
          remove_field => [ "app_timestamp" ]
        }
      }
    }
  }

  # Filebeat's autodiscover decorator adds container metadata. Surface the
  # service's compose name so it's easy to filter by container.
  if [container][name] {
    mutate {
      add_field => { "container_name" => "%{[container][name]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "elms-logs-%{+YYYY.MM.dd}"
  }
  # Mirror to stdout so `docker-compose logs logstash` shows what's being
  # indexed - handy during the demo to prove logs are flowing.
  stdout {
    codec => rubydebug { metadata => false }
  }
}
