# ============================================================================
# Leave Management System - docker-compose.yml
# ----------------------------------------------------------------------------
# Brings up the infrastructure (Consul + RabbitMQ) and the application
# services that are runnable today: API Gateway, Auth, Leave Balance, Leave
# Request, and Manager. The Notification Service stays a commented stub until
# it gains its consumer entry point.
#
# Only the gateway publishes a host port (8080); every other service is reached
# through it over the internal `leave-mgmt-net` network. Service discovery is
# not wired up yet, so the gateway resolves downstreams via the static hostname
# map, which matches the compose service names below.
#
# Usage:
#     docker-compose up consul rabbitmq      # infrastructure only
#     docker-compose up --build              # full system
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  consul:
    image: hashicorp/consul:1.18
    container_name: leave-mgmt-consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"   # HTTP API + Web UI
      - "8600:8600/udp"  # DNS
    networks:
      - leave-mgmt-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: leave-mgmt-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - leave-mgmt-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Application services
  # --------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: leave-mgmt-api-gateway
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SERVICE_NAME: api-gateway
      SERVICE_HOST: api-gateway
      SERVICE_PORT: 8080
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      leave-balance-service:
        condition: service_started
      leave-request-service:
        condition: service_started
      manager-service:
        condition: service_started
    networks:
      - leave-mgmt-net

  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: leave-mgmt-auth-service
    env_file: .env
    environment:
      SERVICE_NAME: auth-service
      SERVICE_HOST: auth-service
      SERVICE_PORT: 8001
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  leave-balance-service:
    build:
      context: .
      dockerfile: leave_balance_service/Dockerfile
    container_name: leave-mgmt-leave-balance-service
    env_file: .env
    environment:
      SERVICE_NAME: leave-balance-service
      SERVICE_HOST: leave-balance-service
      SERVICE_PORT: 8002
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  leave-request-service:
    build:
      context: .
      dockerfile: leave_request_service/Dockerfile
    container_name: leave-mgmt-leave-request-service
    env_file: .env
    environment:
      SERVICE_NAME: leave-request-service
      SERVICE_HOST: leave-request-service
      SERVICE_PORT: 8003
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      leave-balance-service:
        condition: service_started
    networks:
      - leave-mgmt-net

  manager-service:
    build:
      context: .
      dockerfile: manager_service/Dockerfile
    container_name: leave-mgmt-manager-service
    env_file: .env
    environment:
      SERVICE_NAME: manager-service
      SERVICE_HOST: manager-service
      SERVICE_PORT: 8004
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      leave-balance-service:
        condition: service_started
      leave-request-service:
        condition: service_started
    networks:
      - leave-mgmt-net

  # notification-service (enabled once its consumer entry point exists):
  #   build:
  #     context: .
  #     dockerfile: notification_service/Dockerfile
  #   container_name: leave-mgmt-notification-service
  #   env_file: .env
  #   environment:
  #     SERVICE_NAME: notification-service
  #     SERVICE_HOST: notification-service
  #     SERVICE_PORT: 8005
  #   depends_on:
  #     consul:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   networks:
  #     - leave-mgmt-net

networks:
  leave-mgmt-net:
    name: leave-mgmt-net
    driver: bridge
