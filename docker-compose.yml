# ============================================================================
# Leave Management System - docker-compose.yml
# ----------------------------------------------------------------------------
# Currently brings up only the infrastructure: Consul (service discovery)
# and RabbitMQ (message broker). The six application service entries are
# included below as commented stubs and will be enabled once each service
# has its Dockerfile in place.
#
# Usage:
#     docker-compose up consul rabbitmq      # infrastructure only
#     docker-compose up --build              # full system
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  consul:
    image: hashicorp/consul:1.18
    container_name: leave-mgmt-consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"   # HTTP API + Web UI
      - "8600:8600/udp"  # DNS
    networks:
      - leave-mgmt-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: leave-mgmt-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - leave-mgmt-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

