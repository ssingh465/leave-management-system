# ============================================================================
# Leave Management System - docker-compose.yml
# ----------------------------------------------------------------------------
# Brings up the infrastructure (Consul + RabbitMQ) and all six application
# services. Only the gateway publishes a host port (8080); every other service
# is reached through it over the internal `leave-mgmt-net` network.
#
# Each application service declares BOTH a `build:` context (so you can rebuild
# from source) AND an `image:` tag (so you can pull pre-built images from
# Docker Hub). The image name is derived from DOCKERHUB_USERNAME and IMAGE_TAG
# in `.env`; defaults keep the file usable without any environment overrides.
#
# Usage:
#     docker-compose up consul rabbitmq                 # infrastructure only
#     docker-compose up --build                          # build from source and run
#     docker-compose pull && docker-compose up           # pull from Docker Hub and run
#     docker-compose --profile elk up --build            # start the ELK stack
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  consul:
    image: hashicorp/consul:1.18
    container_name: leave-mgmt-consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"   # HTTP API + Web UI
      - "8600:8600/udp"  # DNS
    networks:
      - leave-mgmt-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: leave-mgmt-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - leave-mgmt-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Application services
  # --------------------------------------------------------------------------
  api-gateway:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/elms-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: leave-mgmt-api-gateway
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SERVICE_NAME: api-gateway
      SERVICE_HOST: api-gateway
      SERVICE_PORT: 8080
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      leave-balance-service:
        condition: service_started
      leave-request-service:
        condition: service_started
      manager-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - leave-mgmt-net

  auth-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/elms-auth-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: leave-mgmt-auth-service
    env_file: .env
    environment:
      SERVICE_NAME: auth-service
      SERVICE_HOST: auth-service
      SERVICE_PORT: 8001
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  leave-balance-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/elms-leave-balance-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: leave_balance_service/Dockerfile
    container_name: leave-mgmt-leave-balance-service
    env_file: .env
    environment:
      SERVICE_NAME: leave-balance-service
      SERVICE_HOST: leave-balance-service
      SERVICE_PORT: 8002
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  leave-request-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/elms-leave-request-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: leave_request_service/Dockerfile
    container_name: leave-mgmt-leave-request-service
    env_file: .env
    environment:
      SERVICE_NAME: leave-request-service
      SERVICE_HOST: leave-request-service
      SERVICE_PORT: 8003
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      leave-balance-service:
        condition: service_started
    networks:
      - leave-mgmt-net

  manager-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/elms-manager-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: manager_service/Dockerfile
    container_name: leave-mgmt-manager-service
    env_file: .env
    environment:
      SERVICE_NAME: manager-service
      SERVICE_HOST: manager-service
      SERVICE_PORT: 8004
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      leave-balance-service:
        condition: service_started
      leave-request-service:
        condition: service_started
    networks:
      - leave-mgmt-net

  notification-service:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/elms-notification-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: leave-mgmt-notification-service
    env_file: .env
    environment:
      SERVICE_NAME: notification-service
      SERVICE_HOST: notification-service
      SERVICE_PORT: 8005
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  # --------------------------------------------------------------------------
  # ELK stack (opt-in via `--profile elk`)
  # --------------------------------------------------------------------------
  # Enable with:  docker-compose --profile elk up --build
  # The four services below sit on the same `leave-mgmt-net` network as the
  # application services. Filebeat tails Docker container logs (which are
  # already JSON, thanks to shared/logging_config.py), Logstash decodes the
  # message field, Elasticsearch stores the events, and Kibana (port 5601)
  # provides the UI. The base 8-container stack is unaffected when the profile
  # is not selected.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: leave-mgmt-elasticsearch
    profiles: ["elk"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - leave-mgmt-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: leave-mgmt-logstash
    profiles: ["elk"]
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.monitoring.enabled: "false"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: leave-mgmt-kibana
    profiles: ["elk"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - leave-mgmt-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: leave-mgmt-filebeat
    profiles: ["elk"]
    user: root
    command: ["-e", "-strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      logstash:
        condition: service_started
    networks:
      - leave-mgmt-net

networks:
  leave-mgmt-net:
    name: leave-mgmt-net
    driver: bridge
